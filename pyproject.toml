[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitresume_core", "src/gitresume_cli", "src/gitresume_web"]

[project]
name = "gitresume"
version = "0.0.2"
description = "Generate professional resumes from your GitHub repositories."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jaydeep Solanki", email = "contactjaydeepsolanki@gmail.com" },
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "litellm>=1.81.7",
    "diskcache>=5.6.3",
    "tenacity>=9.0.0",
    "pydantic>=2.12.5",
    "pygithub>=2.8.1",
    "rich>=14.3.2",
    "tree-sitter>=0.25.2",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.12.0",
    "uvicorn>=0.40.0",
    "aiofiles>=24.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "PL"]
ignore = [
    "E402",   # Allow imports not at top of file
    "E501",   # Allow long lines
    "PLR2004", # Allow magic values (common in tests/CLI)
    "PLC0415", # Allow lazy imports (speeds up CLI startup)
    "PLR0913", # Allow many arguments (common in tool/entry functions)
]

[project.scripts]
gitresume = "gitresume_cli.main:app"

[project.urls]
Homepage = "https://github.com/WhoIsJayD/gitresume"
Repository = "https://github.com/WhoIsJayD/gitresume"
Issues = "https://github.com/WhoIsJayD/gitresume/issues"

[dependency-groups]
dev = [
    "pyinstaller>=6.18.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.4",
    "mypy>=1.11.0",
    "types-aiofiles>=24.1.0.20240626",
    "pre-commit>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--cov=gitresume_core --cov=gitresume_cli --cov-report=term-missing"

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
