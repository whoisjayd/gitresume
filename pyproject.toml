[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitresume_core", "src/gitresume_cli", "src/gitresume_web"]

[project]
name = "gitresume"
version = "0.1.0"
description = "Generate professional resumes from your GitHub repositories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "litellm>=1.81.7",
    "diskcache>=5.6.3",
    "tenacity>=9.0.0",
    "pydantic>=2.12.5",
    "pygithub>=2.8.1",
    "rich>=14.3.2",
    "tree-sitter>=0.25.2",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.12.0",
    "uvicorn>=0.40.0",
    "aiofiles>=24.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402", "E501"] # Allow imports not at top of file and long lines for legacy compatibility

[project.scripts]
gitresume = "gitresume_cli.main:app"

[dependency-groups]
dev = [
    "pyinstaller>=6.18.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--cov=gitresume_core --cov=gitresume_cli --cov-report=term-missing"

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
