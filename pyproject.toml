[project]
name = "gitresume"
version = "0.1.0"
description = "Self-hostable FastAPI and Vite app that turns GitHub repositories into resume-ready content."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.28",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
    "redis>=7.4.0",
    "pygithub>=2.9.1",
    "litellm>=1.84.0",
    "tree-sitter>=0.25.2",
    "aiofiles>=25.1.0",
    "pyyaml>=6.0.3",
    "gitingest>=0.3.1",
    "tree-sitter-analyzer[all-languages]>=1.11.1",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.2",
    "taskiq-fastapi>=0.5.0",
    "sse-starlette>=3.4.4",
    "tenacity>=9.1.4",
    "structlog>=25.5.0",
    "networkx>=3.6.1",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "ruff>=0.15.13",
    "fakeredis>=2.35.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitresume"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
