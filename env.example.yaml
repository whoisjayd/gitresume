GITHUB_CLIENT_ID: your_github_client_id
GITHUB_CLIENT_SECRET: your_github_client_secret
GITHUB_TOKEN: your_github_token

REDIS_HOST: your_redis_host
REDIS_PORT: "your_redis_port"
REDIS_USERNAME: your_redis_username
REDIS_PASSWORD: your_redis_password

ENVIRONMENT: production
SESSION_SECRET_KEY: your_session_secret_key
CALLBACK_URL: https://yourdomain.com/callback
CLOUDFLARE_ONLY: "false"

API_ANALYTICS_KEY: your_api_analytics_key

# --- AI Configuration (LiteLLM) ---
# Default model to use (format: provider/model)
AI_MODEL: gemini/gemini-2.0-flash-lite

# API Keys (LiteLLM standard environment variables)
GEMINI_API_KEY: your_gemini_api_key
OPENAI_API_KEY: your_openai_api_key
ANTHROPIC_API_KEY: your_anthropic_api_key
GROQ_API_KEY: your_groq_api_key

# Optional: Model-specific overrides used in grammar check
GRAMMAR_MODEL: gemini/gemini-2.0-flash-lite
